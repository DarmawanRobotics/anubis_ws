# General
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Status bar
set -g status-position top
set -g status-style bg=colour234,fg=colour137
set -g status-left "#[fg=colour81,bold] __WORKSPACE_NAME__ · #S "
set -g status-right "#[fg=colour81] %H:%M %d-%b "
setw -g window-status-current-style fg=colour81,bg=colour238,bold

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Split panes
bind | split-window -h
bind - split-window -v

# Mouse drag-select copies straight into the X11 clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind-key -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -i"