control_node:
  ros__parameters:
    dog_ip: "192.168.234.1"
    local_port: 43988
    sdk_model: "zsl-1w"
    control_frequency_hz: 10.0
    watchdog_timeout_s: 1.0
    max_linear_vel_mps: 0.6
    max_angular_vel_rps: 1.0
    linear_deadzone_mps: 0.05
    auto_stand: true
    publish_odom: true
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    require_localization_valid: true
    localization_valid_topic: "/localization/valid"
    low_battery_threshold_pct: 15.0
    # local_ip intentionally NOT set here -- it's network-specific and
    # must be passed explicitly (launch arg or --ros-args -p local_ip:=...)
    # so it's never silently wrong. See control_node.py's local_ip check.
